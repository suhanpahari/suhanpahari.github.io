short_bio: >-
  <p>
    I am a final-year B.Tech student in Computer Science (Data Science) at
    <a href="https://www.upes.ac.in/" target="_blank">UPES, Dehradun</a>, and a prospective postgraduate
    student based in Kolkata, India. My research is broadly in <strong>computer vision</strong> and its
    physical-world applications.
  </p>
  <p>
    I currently work on 3D scene understanding and cooperative perception for autonomous driving as a
    Pre-Graduate Research Assistant at <a href="https://www.isical.ac.in/" target="_blank">ISI, Kolkata</a>
    (with Prof. Ujjwal Bhattacharya and collaborators at Valeo India), and on multimodal learning and AI for
    science with Prof. Mettu Srinivas at NIT Warangal. My interests span LiDAR/point-cloud and camera-only
    perception, multi-agent cooperative perception with geometric uncertainty and Bayesian fusion, multi-view
    geometry and cross-view localization, and multimodal representation learning.
  </p>

