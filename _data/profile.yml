short_bio: >-
  <p>
    I am a <strong>Pre-Doctoral Research Assistant</strong> at the HR Lab,
    <a href="https://www.isical.ac.in/" target="_blank">Indian Statistical Institute (ISI), Kolkata</a>,
    under the supervision of <a href="https://www.isical.ac.in/~ujjwal/" target="_blank">Prof. Ujjwal Bhattacharya</a>.
    I work on <strong>4D world models</strong> and <strong>3D computer vision</strong> for ADAS (advanced
    driver-assistance systems), in collaboration with Sudip Das from
    <a href="https://www.valeo.com/en/brain-division/" target="_blank">Valeo Brain</a> (PI).
  </p>
  <p>
    My research is broadly in <strong>computer vision</strong> and its physical-world applications: LiDAR/point-cloud
    and camera-only perception for autonomous driving, multi-agent cooperative perception with geometric
    uncertainty and Bayesian fusion, multi-view geometry and cross-view localization, and multimodal
    representation learning. I completed my B.Tech in Computer Science (Data Science) at
    <a href="https://www.upes.ac.in/" target="_blank">UPES, Dehradun</a>.
  </p>

